<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Studio HTML comment mode fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 16px; margin: 16px 0; }
    .swatch { width: 100%; height: 80px; border-radius: 10px; background: linear-gradient(90deg, #0f8b8d, #f2c14e); }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; }
  </style>
</head>
<body>
  <h1>HTML comment fixture</h1>
  <p>Select this sentence in comment mode to test text-selection comments.</p>
  <section class="card">
    <h2>Card element</h2>
    <p>Click this card in comment mode to test element comments.</p>
    <div class="swatch" aria-label="Gradient swatch figure"></div>
  </section>
  <table>
    <thead><tr><th>Name</th><th>Value</th></tr></thead>
    <tbody><tr><td>Alpha</td><td>1</td></tr><tr><td>Beta</td><td>2</td></tr></tbody>
  </table>
</body>
</html>
